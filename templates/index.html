<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Grayscale Video App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        background: #f7f7f7;
      }
      .card {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      input[type="file"] {
        margin: 12px 0;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      .message {
        color: #b91c1c;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Simple Grayscale Video App</h1>
      <p>Upload a video file and download a grayscale version.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" enctype="multipart/form-data">
        <input type="file" name="video" accept="video/*" required />
        <p><small>Video only: MP4, MOV, AVI, and similar formats.</small></p>
        <br />
        <button type="submit">Convert to Grayscale</button>
      </form>
    </div>
  </body>
</html>
